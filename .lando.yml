name: storyos

recipe: lamp
config:
  webroot: wordpress
  php: '8.2'
  composer_version: '2'
  database: mariadb

services:
  appserver:
    type: php:8.2
    webroot: wordpress
    ssl: true
    xdebug: false
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WP_USERNAME: ${WP_USERNAME:-admin}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-admin}
      COMFYUI_URL: ${COMFYUI_URL:-http://127.0.0.1:8188}
      REDIS_URL: redis://cache:6379/0
  database:
    type: mariadb:10.6
    portforward: true
    creds:
      user: wordpress
      password: wordpress
      database: wordpress
    volumes:
      - ./scripts/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
  cache:
    type: redis:7
    portforward: true
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database
tooling:
  wp:
    service: appserver
    cmd: wp
  pma:
    service: phpmyadmin
    cmd: /bin/sh
