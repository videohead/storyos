name: storyos

recipe: lamp
config:
  webroot: wordpress
  php: '8.2'
  composer_version: '2.7.7'
  database: mariadb

services:
  appserver:
    type: php:8.2
    webroot: wordpress
    ssl: true
    xdebug: false
    overrides:
      extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WP_USERNAME: ${WP_USERNAME:-admin}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-admin}
      STORYOS_COMFY_API_KEY: ${STORYOS_COMFY_API_KEY:-}
      STORYOS_AI_API_KEY: ${STORYOS_AI_API_KEY:-}
      STORYOS_AI_FALLBACK_API_KEY: ${STORYOS_AI_FALLBACK_API_KEY:-}
  database:
    type: mariadb:10.6
    portforward: true
    creds:
      user: wordpress
      password: wordpress
      database: wordpress
    volumes:
      - ./scripts/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
  cli:
    type: node:20
    overrides:
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /home/node/.cache/ms-playwright
    run_as_root:
      - "apt-get update && apt-get install -y ffmpeg ripgrep"
      - "npm install sass --save-dev"
      - "npm install minify --save-dev"
      - "npm install jsonlint --save-dev"
      - "npm install @playwright/test playwright --save-dev"
      - "npm install @wordpress/e2e-test-utils-playwright --save-dev"
      - "npm install pixelmatch pngjs --save-dev"
      - "npx playwright install --with-deps chromium"
      - "node -p \"'Chromium: ' + require('/app/node_modules/playwright-core/lib/coreBundle').registry.registry.findExecutable('chromium').executablePath()\""
      - "node -p \"'ffmpeg: ' + require('/app/node_modules/playwright-core/lib/coreBundle').registry.registry.findExecutable('ffmpeg').executablePath('linux')\""
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database
tooling:
  wp:
    service: appserver
    cmd: wp
  phpunit:
    service: appserver
    cmd: ./vendor/bin/phpunit
  wp-cron:
    service: appserver
    cmd: php wp-cron.php
  npm:
    service: cli
    cmd: /usr/local/bin/npm
  node:
    service: cli
    cmd: /usr/local/bin/node
  npx:
    service: cli
    cmd: /usr/local/bin/npx
  sass:
    service: cli
    cmd: /app/node_modules/.bin/sass
  playwright:
    service: cli
    cmd: /usr/local/bin/npx playwright
  ffmpeg:
    service: cli
    cmd: /usr/bin/ffmpeg
  rg:
    service: cli
    cmd: /usr/bin/rg
  jsonlint:
    service: cli
    cmd: /usr/local/bin/npx jsonlint
  pma:
    service: phpmyadmin
    cmd: /bin/sh