x-qwen35moe-common: &qwen35moe-common
  build:
    context: .
    dockerfile: Containerfile
  restart: unless-stopped
  gpus: all
  ports:
    - "11434:11434"
  environment:
    HF_HOME: /models/cache/huggingface
    TRANSFORMERS_CACHE: /models/cache/huggingface
    HUGGINGFACE_HUB_CACHE: /models/cache/huggingface
    VLLM_CACHE_ROOT: /models/cache/vllm
    TORCH_COMPILE_DISABLE: "1"
    HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
  volumes:
    - ./models:/models/cache
    - ./logs:/var/log/vllm
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:11434/v1/models"]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 120s

services:
  qwen35moe-vllm:
    <<: *qwen35moe-common
    profiles:
      - lite
    container_name: qwen35moe-vllm
    command:
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --port
      - "11434"
      - --trust-remote-code
      - --language-model-only
      - --enforce-eager
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "1"
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --max-num-batched-tokens
      - "2304"
      - --gpu-memory-utilization
      - "0.85"
      - --cpu-offload-gb
      - "24"
      - --cpu-offload-params
      - weight
      - --tensor-parallel-size
      - "1"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3

  qwen35moe-vllm-full:
    <<: *qwen35moe-common
    profiles:
      - full
    container_name: qwen35moe-vllm-full
    command:
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --port
      - "11434"
      - --trust-remote-code
      - --language-model-only
      - --enforce-eager
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "2"
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --max-num-batched-tokens
      - "2304"
      - --gpu-memory-utilization
      - "0.92"
      - --cpu-offload-gb
      - "24"
      - --cpu-offload-params
      - weight
      - --tensor-parallel-size
      - "1"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
